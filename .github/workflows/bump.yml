name: Bump nastro

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bump formula if a new release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          formula="Formula/nastro.rb"
          latest_tag="$(gh api repos/scaccogatto/nastro/releases/latest --jq .tag_name)"
          current_tag="$(grep -o '/tags/v[^/]*\.tar\.gz' "$formula" | sed -E 's#/tags/(v[^/]+)\.tar\.gz#\1#')"

          echo "current: $current_tag, latest: $latest_tag"

          if [ "$current_tag" = "$latest_tag" ]; then
            echo "Already up to date, nothing to do."
            exit 0
          fi

          tarball_url="https://github.com/scaccogatto/nastro/archive/refs/tags/${latest_tag}.tar.gz"
          new_sha="$(curl -sL "$tarball_url" | sha256sum | cut -d' ' -f1)"

          sed -i -E "s#archive/refs/tags/v[^/]+\.tar\.gz#archive/refs/tags/${latest_tag}.tar.gz#" "$formula"
          sed -i -E "s/sha256 \"[0-9a-f]+\"/sha256 \"${new_sha}\"/" "$formula"

          version="${latest_tag#v}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$formula"
          git commit -m "nastro ${version}"
          git push
